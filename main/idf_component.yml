dependencies:
  lvgl/lvgl: "^8.3.11"
  espressif/mdns: "^1.3.0"
  espressif/esp_lcd_touch: "^1.0.4"
  # Telephony WAN anchor (TelephonyAnchorClient, ported from drawbridge): OAuth
  # token/JSON parsing (cJSON) and the call-control WS client. Pinned to the
  # same versions drawbridge uses so both projects track one known-good pair.
  espressif/cjson: "^1.7.19"
  espressif/esp_websocket_client: "^1.6.0"
  # v6.0 is the project's supported floor (enforced in main/CMakeLists.txt), so
  # this needs no idf_version rule — on v6 the chip-specific Ethernet PHY drivers
  # live in managed components rather than core esp_eth.
  espressif/w5500:
    version: "^1.0.1"
  # LAN8720 (LAN87xx-family) PHY driver. ESP-IDF v6.0 removed the chip-specific
  # Ethernet PHY drivers from core esp_eth into standalone managed components; this
  # provides esp_eth_phy_new_lan87xx() / esp_eth_phy_lan87xx.h for the classic-ESP32
  # internal-EMAC LAN8720 transport (esp_main_eth_lan8720.cpp). Gated to idf>=6.0 (on
  # v5.x esp_eth still ships the constructor) and to the esp32 target (the only one
  # here with the internal EMAC + LAN8720 board).
  espressif/lan87xx:
    version: "^1.0.0"
    rules:
      # Target rule only: LAN8720 drives the classic ESP32's internal EMAC and
      # exists on no other target. The idf_version rule that sat here is implied
      # by the v6.0 floor in main/CMakeLists.txt.
      - if: "target == esp32"



