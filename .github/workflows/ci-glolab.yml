name: Nightly Host Verification (bigdog)

# Runs the host build/test job a second time, nightly, on the self-hosted
# 'bigdog' runner: a dedicated Hyper-V Gen2 VM (Debian 13, x64) on desmo's XPS,
# built by BigDog on 2026-09-24. It replaced the glolab Raspberry Pi runner
# (ARM64). desmo: "we don't need arm", and the Pi is the bench host (it drives
# the ESP32 boards and household DNS), so it should not carry CI load.
#
# SECURITY BOUNDARY. This is a PUBLIC repo, so this runner must only ever run
# code already merged to main: triggers are schedule + workflow_dispatch, and
# NEVER pull_request / pull_request_target (fork code must not reach desmo's
# machine). The VM is the isolation boundary, not a WSL distro: WSL2 distros
# share one kernel and WSL interop is global, which was proven unfit on
# 2026-09-24. The first step below re-proves the boundary on every run and
# fails the job if any part of it is missing.
#
# 09:17 UTC = 05:17 US Eastern (EDT), 04:17 under EST. Minute 17, not :00:
# GitHub delays or drops scheduled runs at the top of the hour under load, and a
# missed nightly is silent.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Scoped per-commit. With the push trigger gone, the only collision left is
  # a nightly run and a manual dispatch landing on the same unchanged SHA,
  # where cancelling the older of two identical builds is harmless. (History:
  # a static group under the old push trigger starved every run during merge
  # bursts, 29/29 cancelled in a row on 2026-09-16. Per-SHA groups fixed that
  # and are kept so two different SHAs never cancel each other.)
  group: bigdog-host-verify-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-test-host-nightly:
    name: Host Build & Simulation Testing (bigdog, nightly)
    runs-on: [self-hosted, bigdog]
    env:
      # Kept in sync with the CPPCHECK_VERSION pin in ci.yml (Issue #112).
      CPPCHECK_VERSION: 2.21.0

    steps:
      # FIRST, before any repo code runs: prove the isolation boundary this
      # runner exists for (see the header). Any failure fails the job, so a
      # nightly can never quietly run on a box that has lost its isolation.
      - name: Verify runner isolation (VM boundary)
        run: |
          fail=0
          check() { if eval "$2"; then echo "ok   $1"; else echo "FAIL $1"; fail=1; fi; }
          check "no /mnt/c (no Windows filesystem)"          '[ ! -e /mnt/c ]'
          check "no 9p/drvfs/virtiofs/cifs mounts"           '! grep -Eq " (9p|drvfs|virtiofs|cifs) " /proc/mounts'
          check "no WSL interop handler"                     '[ ! -e /proc/sys/fs/binfmt_misc/WSLInterop ]'
          check "no Windows executables on PATH"             '! command -v cmd.exe >/dev/null && ! command -v powershell.exe >/dev/null'
          check "runner user has no sudo"                    '! sudo -n true 2>/dev/null'
          check "no SSH private keys in home"                '! grep -rlsE "BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY" "$HOME" --exclude-dir=_work --exclude-dir=_diag'
          check "not running as root"                        '[ "$(id -u)" -ne 0 ]'
          check "triggered by schedule or dispatch only"     'case "$GITHUB_EVENT_NAME" in schedule|workflow_dispatch) true;; *) false;; esac'
          check "no GitHub tokens in home"                   '! grep -rlsE "(ghp|gho|ghu|ghs|github_pat)_[A-Za-z0-9_]{20,}" "$HOME" --exclude-dir=_work --exclude-dir=_diag'
          echo "runner: $(uname -srm) as $(id -un)"
          [ "$fail" -eq 0 ] || { echo "::error::Runner isolation check failed; refusing to run repo code on this host."; exit 1; }

      - name: Checkout Repository
        uses: actions/checkout@v4

      # No "Install System Dependencies" step here: this runner is a persistent,
      # non-ephemeral host and the ghrunner service account has no sudo access
      # by design, so dependencies (cmake, build-essential, clang-tidy, jq,
      # curl) are provisioned once out-of-band instead of via apt-get in CI.

      - name: Cache pinned cppcheck build
        id: cppcheck-cache
        uses: actions/cache@v4
        with:
          path: ~/cppcheck-install
          key: ${{ runner.os }}-${{ runner.arch }}-cppcheck-${{ env.CPPCHECK_VERSION }}

      - name: Build & Install cppcheck (pinned version)
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o cppcheck.tar.gz \
            "https://github.com/danmar/cppcheck/archive/refs/tags/${CPPCHECK_VERSION}.tar.gz"
          tar xzf cppcheck.tar.gz
          cmake -S "cppcheck-${CPPCHECK_VERSION}" -B cppcheck-build \
                -DCMAKE_BUILD_TYPE=Release -DUSE_MATCHCOMPILER=ON \
                -DBUILD_TESTS=OFF -DBUILD_GUI=OFF \
                -DCMAKE_INSTALL_PREFIX="$HOME/cppcheck-install"
          cmake --build cppcheck-build -j"$(nproc)"
          cmake --install cppcheck-build

      - name: Run Static Analysis (cppcheck)
        # The invocation and its suppressions (including why Sdp.cpp is
        # suppressed) live in tools/ci/run_cppcheck.sh, shared with the
        # other workflow so the two gates can't drift apart again.
        run: bash tools/ci/run_cppcheck.sh

      - name: Configure CMake (Host Build)
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build Host Binary
        run: |
          cmake --build build --config Release

      - name: Static Analysis (clang-tidy over src/**)
        continue-on-error: true
        run: |
          echo "Running clang-tidy over first-party sources (src/**)..."
          CHECKS="-*,bugprone-*,performance-*,clang-analyzer-*,-bugprone-easily-swappable-parameters,-bugprone-narrowing-conversions"
          : > clang-tidy.log
          while IFS= read -r f; do
            echo "--- $f ---"
            clang-tidy -p build --quiet \
                       --header-filter='.*/src/.*' \
                       --checks="$CHECKS" \
                       "$f" 2>&1 | tee -a clang-tidy.log || true
          done < <(find src -name '*.cpp' | sort)
          COUNT=$(grep -cE "warning:|error:" clang-tidy.log || true)
          # --header-filter reprints every shared-header finding once per
          # including .cpp file, so COUNT is inflated by that duplication --
          # see ci.yml's matching step for the full explanation. UNIQUE
          # collapses exact-duplicate lines to show the real number of
          # distinct findings. This step is purely informational (no gate),
          # so the stale "~59" hint is dropped -- ci.yml's pinned clang-tidy
          # step carries the real measured baseline (see #254).
          UNIQUE=$(grep -E "warning:|error:" clang-tidy.log | sort -u | wc -l | tr -d ' ')
          echo "clang-tidy total diagnostics: ${COUNT} (${UNIQUE} distinct, see ci.yml for the pinned/baselined version)"

      - name: Run Unit Test Suite (GoogleTest via CTest)
        env:
          GTEST_OUTPUT: json:${{ github.workspace }}/build/gtest-reports/
        run: |
          # Self-hosted: the workspace can outlive a run, so clear any report a
          # previous run left behind before counting this one.
          rm -rf build/gtest-reports
          ctest --test-dir build/tests --output-on-failure

      - name: Verify Test Count (floor in tests/EXPECTED_MIN_TESTS)
        run: |
          # See ci.yml: ctest reports the suite as one test (#390).
          python3 tests/tools/check_test_count.py build/gtest-reports

      - name: Verify SIP Parser Call Graph (T-7 recursion/frame guard)
        run: |
          python3 tests/tools/check_parser_callgraph.py

      - name: Verify Partition Table (dual-OTA layout guard)
        run: |
          python3 - <<'PYEOF'
          import re, sys
          PATH = "partitions.csv"
          FLASH = 16 * 1024 * 1024  # ESP32-S3 16 MB

          def parse_num(s):
              s = s.strip()
              m = re.fullmatch(r'(0[xX][0-9a-fA-F]+|\d+)([KkMm]?)', s)
              if not m:
                  raise ValueError("cannot parse number %r" % s)
              base = int(m.group(1), 0)
              suf = m.group(2).lower()
              if suf == 'k': base *= 1024
              elif suf == 'm': base *= 1024 * 1024
              return base

          rows = []
          with open(PATH) as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  parts = [p.strip() for p in line.split(',')]
                  if len(parts) < 5:
                      continue
                  name, ptype, subtype, off, size = parts[:5]
                  rows.append((name, ptype, subtype, parse_num(off), parse_num(size)))

          names = {r[0] for r in rows}
          errors = []
          for required in ("ota_0", "ota_1", "otadata"):
              if required not in names:
                  errors.append("missing required partition '%s'" % required)
          if "factory" in names:
              errors.append("partition 'factory' present — layout regressed to single-slot (OTA disabled)")
          for name, ptype, subtype, off, size in rows:
              if off + size > FLASH:
                  errors.append("partition '%s' ends at 0x%x, exceeds 16MB (0x%x)" % (name, off + size, FLASH))
          slots = {r[0]: r for r in rows if r[0] in ("ota_0", "ota_1")}
          if "ota_0" in slots and "ota_1" in slots:
              if slots["ota_0"][4] != slots["ota_1"][4]:
                  errors.append("ota_0 size (0x%x) != ota_1 size (0x%x)" % (slots["ota_0"][4], slots["ota_1"][4]))
              for s in ("ota_0", "ota_1"):
                  if slots[s][1] != "app":
                      errors.append("%s is type '%s', expected 'app'" % (s, slots[s][1]))

          if errors:
              print("PARTITION GUARD: FAIL")
              for e in errors:
                  print("  - " + e)
              sys.exit(1)
          print("PARTITION GUARD: PASS (dual-OTA layout intact)")
          for name, ptype, subtype, off, size in rows:
              print("  %-10s type=%-5s sub=%-8s off=0x%x size=0x%x end=0x%x" % (name, ptype, subtype, off, size, off + size))
          PYEOF

      - name: Execute HTTP API Smoke Suite (host)
        run: |
          echo "Starting simulated SIP & HTTP Server (5060 SIP / 8080 dashboard)..."
          ./build/SipServer --ip 127.0.0.1 --port 5060 --web 8080 </dev/null &
          SERVER_PID=$!
          export SERVER_PID

          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ || echo 000)
            [ "$code" = "200" ] && break
            sleep 0.5
          done

          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "Error: SipServer failed to start or crashed on boot."
            exit 1
          fi
          echo "Simulated Server is active (PID: $SERVER_PID). Running test_api.sh..."

          set +e
          bash tests/http/test_api.sh 127.0.0.1:8080
          RC=$?
          set -e

          echo "Shutting down Simulated Server..."
          kill -9 "$SERVER_PID" 2>/dev/null || true

          if [ "$RC" -ne 0 ]; then
            echo "HTTP API smoke suite FAILED (exit $RC)."
            exit "$RC"
          fi
          echo "HTTP API smoke suite PASSED."
