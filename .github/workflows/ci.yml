name: ESP32 Pocket-Dial Firmware CI

on:
  # Both filters are '**' (every branch) rather than an explicit allowlist.
  # This block hadn't been touched since the file was first added (2026-06-01,
  # git blame), predating this repo's actual branch conventions -- push's old
  # 'feature/**' glob never matched a real branch (this repo uses feat/, fix/,
  # docs/, and assorted ad-hoc names) and pull_request's [main, master] meant a
  # PR based on an unmerged feat/** branch (a stacked PR) got NO CI at all: no
  # host tests, no cppcheck, nothing, and `gh pr checks` just reports "no
  # checks reported" instead of erroring. Bit us for real on #242. A whitelist
  # of prefixes drifts again the next time someone invents a new one (see
  # ci-perf-lints/, claude/, embedded-fixes/, phase2-polish/ in history) --
  # '**' can't go stale. push and pull_request firing on the same branch
  # double-runs CI for a normal PR; that costs runner minutes, not signal.
  # Neither filter matches tag pushes (no `tags:` key here), so this stays
  # disjoint from release.yml's tags-only trigger.
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  # Job 1: Build and simulate the host desktop application, run static analysis and unit/smoke tests.
  # This serves as our simulation-based test suite, validating SIP and HTTP server logic on host runners.
  build-and-test-host:
    name: Host Build & Simulation Testing
    runs-on: ubuntu-latest
    env:
      # Pinned analyzer version (Issue #112) -- bump deliberately, not via a
      # runner-image update. 2.21.0 is the version this pin was verified
      # against: every `// cppcheck-suppress ...` comment landed alongside
      # this pin (SipStatus.cpp, PcapCapture.hpp, RequestsHandler.hpp/.cpp,
      # AnchorClient.hpp, DnsServer.cpp, esp_main_eth*.cpp) was added because
      # 2.21.0 flags it and the prior floating apt version (2.13.0) did not.
      # Bumping this version is expected to surface new findings to triage,
      # not to fail silently -- do not bump without re-running locally first.
      CPPCHECK_VERSION: 2.21.0

      # Pinned code generator (issue #196) -- same reasoning as the analyzer
      # pin above, and pinned from day one rather than after it broke.
      # src/SIP/Sdp.cpp is GENERATED from Sdp.re and committed, and the drift
      # check below regenerates it and diffs. That check is only meaningful
      # if CI's re2c matches the version the committed file was generated
      # with: re2c stamps its version on line 1 of its own output, so a
      # mismatch is a guaranteed one-line diff on every run, forever.
      # ubuntu-latest's apt ships 3.1; the committed file is 4.1. Bump this
      # deliberately, regenerate, and commit the result in the same PR.
      RE2C_VERSION: "4.1"

      # Pinned linter (issue #254). Same reasoning as the two pins above,
      # and added AFTER it had already drifted: the step below installed a
      # bare `clang-tidy`, which tracks whatever ubuntu-latest ships, so the
      # diagnostic count moved with the runner image rather than with the
      # code. It reached 260 against a stated baseline of ~59 -- a gate that
      # had stopped gating, because nobody could tell a regression from the
      # pre-existing pile.
      #
      # 18 is what noble's unversioned package already resolved to
      # (1:18.1.3-1), so pinning here changes no behaviour today and makes a
      # future bump a deliberate commit. Bumping is EXPECTED to move the
      # count: re-measure and update CLANG_TIDY_BASELINE in the same PR.
      CLANG_TIDY_VERSION: "18"

      # Diagnostics this tree is known to carry, measured against the pinned
      # version above. NOT an aspiration -- a high-water mark, so a new
      # finding is visible instead of lost in the noise. See the step below
      # for why it is not yet enforced.
      # MEASURED, not estimated: 258 is what clang-tidy-18 (Ubuntu LLVM
      # 18.1.3) reported on this branch's own CI run, with the generated
      # Sdp.cpp excluded. Re-measure and update this in the SAME PR as any
      # CLANG_TIDY_VERSION bump -- a version change moves the count, which
      # is the whole reason the previous "~59" had drifted to 260.
      CLANG_TIDY_BASELINE: "258"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: "Verify MSVC string-literal caps (issue #270)"
        # src/Helpers/index_html.h is split into PD_HTML_0..N for exactly
        # one reason: MSVC caps a single string-literal TOKEN and the
        # dashboard page is far past it. GCC and Clang have no comparable
        # limit and every runner in this repo is Linux, so a part that grows
        # past the cap builds green on all of them, merges, and then fails
        # for whoever next compiles on Windows -- `C2026: string too big,
        # trailing characters truncated`, pointing at a line they did not
        # write. Nothing enforced that until this step.
        #
        # No Windows runner is needed: the constraint is a BYTE COUNT, and
        # the caps were measured against the real cl.exe once
        # (tools/msvc_literal_cap_probe.py, re-runnable on any dev box) so
        # this check can be a sub-second Python step on the runner we
        # already pay for.
        #
        # FIRST step in the job, before dependency installation, because it
        # needs nothing but python3 and answers in under a second -- a
        # literal-cap failure should not cost a full build to discover.
        #
        # --selftest runs first, deliberately. The scanner is the part that
        # can be wrong without looking wrong: index_html.h uses a DIFFERENT
        # raw-string delimiter per part, and an extractor that assumes one
        # uniform tag reports confident, specific, entirely fake byte counts
        # rather than failing visibly. The self-test pins the cases that get
        # that wrong, so a broken checker fails loudly instead of quietly
        # reporting PASS on numbers it invented.
        run: |
          python3 tools/check_string_literal_caps.py --selftest
          python3 tools/check_string_literal_caps.py

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # libssl-dev: issue #159's GoogleServiceAuth_test.cpp/tests/CMakeLists.txt
          # find_package(OpenSSL REQUIRED) for the host-side RS256 JWT signing test
          # (mbedTLS is the on-device backend; IDF's own mbedtls ships only
          # mbedtls/private/* headers, so the host build uses OpenSSL instead --
          # same reasoning SipDigest.hpp documents for vendoring its own MD5).
          # clang-tidy is installed VERSIONED (issue #254). A bare
          # `clang-tidy` tracks the runner image and silently changes what
          # the analysis step reports.
          sudo apt-get install -y cmake build-essential "clang-tidy-${CLANG_TIDY_VERSION}" jq curl libssl-dev

      - name: Cache pinned cppcheck build
        id: cppcheck-cache
        uses: actions/cache@v4
        with:
          path: ~/cppcheck-install
          key: ${{ runner.os }}-cppcheck-${{ env.CPPCHECK_VERSION }}

      - name: Build & Install cppcheck (pinned version)
        # Issue #112: the apt package tracks ubuntu-latest's own image, so the
        # analyzer version (and therefore what it finds) floats with every
        # runner-image bump -- a future bump can turn a green PR red on code
        # nobody touched. cppcheck ships no prebuilt Linux binary, so the
        # version is pinned by building it from its own tagged source instead
        # (cached above, keyed on the version, so this only runs once per bump).
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o cppcheck.tar.gz \
            "https://github.com/danmar/cppcheck/archive/refs/tags/${CPPCHECK_VERSION}.tar.gz"
          tar xzf cppcheck.tar.gz
          cmake -S "cppcheck-${CPPCHECK_VERSION}" -B cppcheck-build \
                -DCMAKE_BUILD_TYPE=Release -DUSE_MATCHCOMPILER=ON \
                -DBUILD_TESTS=OFF -DBUILD_GUI=OFF \
                -DCMAKE_INSTALL_PREFIX="$HOME/cppcheck-install"
          cmake --build cppcheck-build -j"$(nproc)"
          cmake --install cppcheck-build

      - name: Run Static Analysis (cppcheck)
        # On the Sdp.cpp suppression below: that file is re2c OUTPUT (issue
        # #196). It is never hand-edited and is drift-checked against Sdp.re,
        # so a finding in it cannot be fixed in place -- any edit would just be
        # reverted by the next regeneration and flagged as drift.
        #
        # The finding itself is benign codegen: the generated DFA walks its
        # input by incrementing a by-value `const char* YYCURSOR` parameter,
        # which cppcheck reports as uselessAssignmentPtrArg -- an assignment to
        # a pointer parameter with no effect outside the function. Literally
        # true and beside the point: the caller wants the returned token, not
        # the final cursor position.
        #
        # Scoped to that ONE check on that ONE file, deliberately, rather than
        # the blanket `--suppress=*:<path>` used for qrcode.c below. Generated
        # code can still contain findings worth acting on; silencing the whole
        # file would hide them permanently.
        run: |
          export PATH="$HOME/cppcheck-install/bin:$PATH"
          cppcheck --version
          cppcheck --error-exitcode=1 \
                   --enable=warning,performance \
                   --inline-suppr \
                   --suppress=missingIncludeSystem \
                   --suppress=unmatchedSuppression \
                   --suppress=*:main/ui/qrcode.c \
                   --suppress=*:main/ui/qrcode.h \
                   --suppress=unknownMacro:main/ui/ui.cpp \
                   --suppress=uselessAssignmentPtrArg:src/SIP/Sdp.cpp \
                   -I src/Helpers -I src/SIP -I main \
                   src/ main/

      - name: Cache pinned re2c build
        id: re2c-cache
        uses: actions/cache@v4
        with:
          path: ~/re2c-install
          key: ${{ runner.os }}-re2c-${{ env.RE2C_VERSION }}

      - name: Build & Install re2c (pinned version)
        # Built from the tagged release rather than installed from apt, for
        # the same reason cppcheck is (issue #112): the apt package tracks
        # the runner image, so a runner bump would change the generated
        # output and redden a PR nobody touched. Cached on the version, so
        # this runs once per bump rather than once per build.
        if: steps.re2c-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o re2c.tar.xz \
            "https://github.com/skvadrik/re2c/releases/download/${RE2C_VERSION}/re2c-${RE2C_VERSION}.tar.xz"
          tar xf re2c.tar.xz
          cd "re2c-${RE2C_VERSION}"
          ./configure --prefix="$HOME/re2c-install"
          make -j"$(nproc)"
          make install

      - name: Verify committed Sdp.cpp matches Sdp.re (re2c drift check)
        # src/SIP/Sdp.cpp is generated and committed so the firmware build
        # never needs re2c. This step is what keeps the committed copy
        # honest: regenerate and diff.
        #
        # --no-debug-info is NOT optional and must not be dropped to get
        # nicer diagnostics. Without it re2c emits #line directives carrying
        # the ABSOLUTE path of the .re source, so output generated on a
        # developer's machine can never match output generated here and this
        # check is red on every run regardless of drift.
        run: |
          export PATH="$HOME/re2c-install/bin:$PATH"
          re2c --version
          re2c --no-generation-date --no-debug-info -W \
               src/SIP/Sdp.re -o /tmp/Sdp.regenerated.cpp
          if ! diff -u src/SIP/Sdp.cpp /tmp/Sdp.regenerated.cpp; then
            echo "::error::src/SIP/Sdp.cpp is out of sync with Sdp.re."
            echo "Regenerate with:"
            echo "  re2c --no-generation-date --no-debug-info -W src/SIP/Sdp.re -o src/SIP/Sdp.cpp"
            echo "If the only difference is the version stamp on line 1, CI's re2c"
            echo "and yours disagree -- match RE2C_VERSION in this workflow."
            exit 1
          fi
          echo "Sdp.cpp is in sync with Sdp.re."

      - name: Configure CMake (Host Build)
        run: |
          # Export the compile DB so the clang-tidy step below can analyze the
          # project's own sources with the exact host compile flags.
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build Host Binary
        run: |
          cmake --build build --config Release

      - name: Static Analysis (clang-tidy over src/**)
        # NON-BLOCKING by design, and deliberately still so after #254.
        #
        # clang-tidy runs over the project's own first-party sources using the
        # CMake compile DB. The tree carries a real pile of pre-existing
        # performance/bugprone findings (pass-by-value params, endl flushes, an
        # intentional widening multiply in the OTA size clamp), and the original
        # brief was explicit that clang-tidy must not block the pipeline on
        # those. That policy is unchanged here.
        #
        # WHAT #254 FIXED is that the step had stopped carrying information at
        # all. The stated baseline said ~59; the actual count had reached 260,
        # because the linter was UNPINNED and drifted with the runner image --
        # `performance-enum-size` alone contributed ~120, the signature of a
        # tool that started reporting something new rather than of code that
        # decayed. With the number four times wrong, nobody could distinguish a
        # regression from the pile, so the count was noise.
        #
        # Now: the version is pinned and PRINTED, the generated file is
        # excluded, and the baseline is a measured high-water mark that emits a
        # ::warning:: annotation when exceeded. Dropping `continue-on-error` is
        # now actually possible -- the baseline means something -- but it is a
        # POLICY change that should be decided on its own, not smuggled in with
        # a measurement fix.
        continue-on-error: true
        run: |
          CT="clang-tidy-${CLANG_TIDY_VERSION}"
          # PRINT THE VERSION. The step never did, so no log could tell you
          # which tool produced a count -- which is a large part of why the
          # drift in #254 went unnoticed for so long.
          "$CT" --version
          echo "Running $CT over first-party sources (src/**)..."
          CHECKS="-*,bugprone-*,performance-*,clang-analyzer-*,-bugprone-easily-swappable-parameters,-bugprone-narrowing-conversions"
          : > clang-tidy.log
          # Only our own translation units; header-filter keeps third-party /
          # system headers out of the report.
          while IFS= read -r f; do
            echo "--- $f ---"
            "$CT" -p build --quiet \
                       --header-filter='.*/src/.*' \
                       --checks="$CHECKS" \
                       "$f" 2>&1 | tee -a clang-tidy.log || true
          # src/SIP/Sdp.cpp is GENERATED from Sdp.re by re2c and is never hand
          # edited, so a finding in it cannot be acted on -- any fix would be
          # reverted by the next regeneration and flagged by the drift check.
          # cppcheck already excludes it for exactly this reason.
          done < <(find src -name '*.cpp' ! -path 'src/SIP/Sdp.cpp' | sort)
          COUNT=$(grep -cE "warning:|error:" clang-tidy.log || true)
          # --header-filter makes every shared-header finding (an enum sizing
          # suggestion in Session.hpp, say) reprint once per .cpp translation
          # unit that includes it -- with this many TUs sharing a handful of
          # SIP headers, that inflates COUNT far past the number of distinct
          # things anyone could actually go fix. UNIQUE collapses exact
          # duplicate "file:line:col: warning: ..." lines (identical text,
          # since it's the same physical header location every time) so the
          # log states plainly how much of COUNT is one real finding echoed
          # N times. COUNT vs CLANG_TIDY_BASELINE stays the gating comparison
          # -- that's #254's measured baseline and changing what it means is
          # a separate decision, not something to fold in here.
          UNIQUE=$(grep -E "warning:|error:" clang-tidy.log | sort -u | wc -l | tr -d ' ')
          echo "================================================================"
          echo "clang-tidy total diagnostics: ${COUNT} (baseline ${CLANG_TIDY_BASELINE}, pinned clang-tidy-${CLANG_TIDY_VERSION})"
          echo "of which ${UNIQUE} are distinct findings -- the rest are the same header-level finding reprinted per including .cpp file"
          if [ "${COUNT}" -gt "${CLANG_TIDY_BASELINE}" ]; then
            echo "::warning::clang-tidy diagnostics ${COUNT} exceed the baseline ${CLANG_TIDY_BASELINE} by $(( COUNT - CLANG_TIDY_BASELINE )). A new finding has been introduced, or the pinned version changed."
          fi
          echo "Diagnostics by check:"
          grep -oE "\[[a-z0-9-]+(,[a-z0-9-]+)*\]$" clang-tidy.log | sort | uniq -c | sort -rn || true
          echo "Distinct findings (deduplicated across including .cpp files):"
          grep -E "warning:|error:" clang-tidy.log | sort -u || true
          echo "================================================================"

      - name: Run Unit Test Suite (GoogleTest via CTest)
        run: |
          # The sip_parser_tests target is registered with CTest in
          # tests/CMakeLists.txt. Because the root CMakeLists.txt enables testing
          # only inside the tests/ subdirectory, the CTest test set lives at
          # build/tests (not the build root) — so we point ctest there. ctest
          # returns non-zero on any test failure, which FAILS this step (the gate).
          ctest --test-dir build/tests --output-on-failure

      - name: Verify Partition Table (dual-OTA layout guard)
        run: |
          # Lightweight guard: assert partitions.csv keeps the dual-OTA layout
          # (ota_0 + ota_1 + otadata), has NOT regressed to a single `factory`
          # app slot, and that every partition fits inside 16 MB flash. Fails CI
          # if the OTA layout regresses.
          python3 - <<'PYEOF'
          import re, sys
          PATH = "partitions.csv"
          FLASH = 16 * 1024 * 1024  # ESP32-S3 16 MB

          def parse_num(s):
              s = s.strip()
              m = re.fullmatch(r'(0[xX][0-9a-fA-F]+|\d+)([KkMm]?)', s)
              if not m:
                  raise ValueError("cannot parse number %r" % s)
              base = int(m.group(1), 0)
              suf = m.group(2).lower()
              if suf == 'k': base *= 1024
              elif suf == 'm': base *= 1024 * 1024
              return base

          rows = []
          with open(PATH) as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  parts = [p.strip() for p in line.split(',')]
                  if len(parts) < 5:
                      continue
                  name, ptype, subtype, off, size = parts[:5]
                  rows.append((name, ptype, subtype, parse_num(off), parse_num(size)))

          names = {r[0] for r in rows}
          errors = []
          for required in ("ota_0", "ota_1", "otadata"):
              if required not in names:
                  errors.append("missing required partition '%s'" % required)
          if "factory" in names:
              errors.append("partition 'factory' present — layout regressed to single-slot (OTA disabled)")
          for name, ptype, subtype, off, size in rows:
              if off + size > FLASH:
                  errors.append("partition '%s' ends at 0x%x, exceeds 16MB (0x%x)" % (name, off + size, FLASH))
          slots = {r[0]: r for r in rows if r[0] in ("ota_0", "ota_1")}
          if "ota_0" in slots and "ota_1" in slots:
              if slots["ota_0"][4] != slots["ota_1"][4]:
                  errors.append("ota_0 size (0x%x) != ota_1 size (0x%x)" % (slots["ota_0"][4], slots["ota_1"][4]))
              for s in ("ota_0", "ota_1"):
                  if slots[s][1] != "app":
                      errors.append("%s is type '%s', expected 'app'" % (s, slots[s][1]))

          if errors:
              print("PARTITION GUARD: FAIL")
              for e in errors:
                  print("  - " + e)
              sys.exit(1)
          print("PARTITION GUARD: PASS (dual-OTA layout intact)")
          for name, ptype, subtype, off, size in rows:
              print("  %-10s type=%-5s sub=%-8s off=0x%x size=0x%x end=0x%x" % (name, ptype, subtype, off, size, off + size))
          PYEOF

      - name: Execute HTTP API Smoke Suite (host)
        run: |
          # Single source of truth: tests/http/test_api.sh is the ONE HTTP smoke
          # suite, used both here (host build) and on real hardware. It runs, in
          # this order: happy-path -> CSRF -> input-validation (16 KB cap) ->
          # 404 -> OTA (while UNPROVISIONED) -> admin-auth (LAST, sets a PIN).
          echo "Starting simulated SIP & HTTP Server (5060 SIP / 8080 dashboard)..."
          ./build/SipServer --ip 127.0.0.1 --port 5060 --web 8080 </dev/null &
          SERVER_PID=$!
          export SERVER_PID

          # Wait for the HTTP port to accept connections (bounded).
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ || echo 000)
            [ "$code" = "200" ] && break
            sleep 0.5
          done

          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "Error: SipServer failed to start or crashed on boot."
            exit 1
          fi
          echo "Simulated Server is active (PID: $SERVER_PID). Running test_api.sh..."

          # The script exports SERVER_PID-awareness: the OTA-reboot test asserts the
          # process is STILL ALIVE afterwards (the desktop reboot must be a no-op).
          set +e
          bash tests/http/test_api.sh 127.0.0.1:8080
          RC=$?
          set -e

          echo "Shutting down Simulated Server..."
          kill -9 "$SERVER_PID" 2>/dev/null || true

          if [ "$RC" -ne 0 ]; then
            echo "HTTP API smoke suite FAILED (exit $RC)."
            exit "$RC"
          fi
          echo "HTTP API smoke suite PASSED."

  # Job 2: Build firmware for target ESP32 and ESP32-S3 boards using official Espressif Docker Images.
  # This establishes compiler verification across multiple ESP-IDF versions and target architectures.
  build-esp-idf:
    name: Build Firmware (ESP-IDF Matrix)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v6.0.1 only: the managed components (espressif/w5500, espressif/lan87xx,
        # wolfSSL/wolfSSH) and the source guards have moved to the v6 APIs, so the
        # older v5.1.2/v5.2.1 legs no longer build. v6.0.1 is the single supported
        # toolchain.
        idf-version: [ 'v6.0.1' ]
        target-chip: [ 'esp32', 'esp32s3' ]
        sip-transport: [ 'wifi', 'eth' ]
        # The W5500 'eth' transport's default board pin maps (LilyGO T-ETH-ELITE /
        # Waveshare ESP32-S3-ETH) use ESP32-S3-only GPIOs (47/48 on the Elite), so an
        # esp32 + eth build is meaningless and only gave false coverage — exclude it.
        # (Internal-EMAC Ethernet on the classic ESP32 is the separate 'lan8720'
        # transport, not 'eth'.)
        exclude:
          - target-chip: 'esp32'
            sip-transport: 'eth'
        # The "display" transport is esp32s3-only and pulls heavy managed components
        # (lvgl ^8.3.11, esp_lcd_touch, the AXS15231B driver, wolfSSL/wolfSSH — see
        # main/idf_component.yml). Added as a single include leg rather than expanding
        # the full matrix.
        include:
          - idf-version: 'v6.0.1'
            target-chip: 'esp32s3'
            sip-transport: 'display'
          # lan8720: internal-EMAC Ethernet on the CLASSIC esp32 (no other target
          # has the EMAC, and main/CMakeLists.txt hard-errors at configure time
          # if you try). Added because it was the one transport nothing verified:
          # not this matrix, and not the release workflow either. It carries its
          # own PHY driver include from the espressif/lan87xx managed component,
          # so a change to that include path could break it silently and only
          # surface on a user's board.
          - idf-version: 'v6.0.1'
            target-chip: 'esp32'
            sip-transport: 'lan8720'

    container:
      image: espressif/idf:${{ matrix.idf-version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache ESP-IDF Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            build
          key: ${{ runner.os }}-idf-${{ matrix.idf-version }}-${{ matrix.target-chip }}-${{ matrix.sip-transport }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-idf-${{ matrix.idf-version }}-${{ matrix.target-chip }}-${{ matrix.sip-transport }}-

      - name: Export Environment & Build Firmware
        run: |
          # 1. Initialize ESP-IDF build environment
          . $IDF_PATH/export.sh
          
          # 2. Configure target board architecture
          idf.py set-target ${{ matrix.target-chip }}
          
          # 3. Build firmware with specified transport layer configuration
          idf.py -D SIP_TRANSPORT=${{ matrix.sip-transport }} build
          
          echo "Successful compilation for ${{ matrix.target-chip }} on ESP-IDF ${{ matrix.idf-version }} (Transport: ${{ matrix.sip-transport }})"

  # Job 2b: Heap-poisoning build.
  # The shipped default is HEAP_POISONING_LIGHT, which only checks an
  # allocation's canaries when it is freed. COMPREHENSIVE also fills on alloc and
  # free, catching uninitialised reads and use-after-free -- the class of bug
  # that shipped in draw_qr() (a freshly malloc'd 19 KB canvas painted to the
  # display when QR encoding failed). Too costly to ship on a device carrying
  # real-time audio, so it is exercised here instead of in the default build.
  # One leg is enough: this proves the profile still compiles and links, which is
  # what rots. Actually exercising the poisoning needs the code running on
  # hardware.
  build-heap-poisoning:
    name: Build Firmware (heap poisoning)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build with COMPREHENSIVE heap poisoning
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py -D SIP_TRANSPORT=eth \
                 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.heap_debug" \
                 build
          echo "Heap-poisoning profile builds (esp32s3 / eth)."

  # Job 2c: Waveshare ESP32-S3-ETH board build.
  # PD_ETH_BOARD=waveshare (main/CMakeLists.txt) is a second pin map for the
  # 'eth' transport, documented and FATAL_ERROR-guarded like a maintained
  # option, but it is in neither this matrix nor release.yml -- nothing has
  # compiled it since it was added, which is how three of six pins shipped
  # wrong to main (#155/#156). This is a dedicated job rather than a leg
  # folded into build-esp-idf's matrix via `include`: an include entry that
  # only adds a new key (pd-eth-board) to keys matching an EXISTING
  # esp32s3/eth combination merges into that combination instead of creating
  # a new one, which would silently turn the shipped Elite build into a
  # Waveshare build (and lose Elite coverage) rather than adding anything.
  # (`display` and `lan8720` avoid this because their sip-transport value
  # isn't already in the base matrix.)
  #
  # This is bit-rot protection ONLY: it proves PD_ETH_BOARD=waveshare still
  # compiles, nothing more. It would NOT have caught #155 -- wrong GPIO
  # numbers compile fine, the bug was only visible on real hardware. The
  # Waveshare board is not on the continuous CI/release bench (that board was
  # verified by hand for #155 -- see esp_main_eth.cpp), so this leg carries no
  # hardware coverage and there is no leg for it in release.yml either; the
  # release ships PD_ETH_BOARD=elite.
  build-waveshare:
    name: Build Firmware (esp32s3 / eth / PD_ETH_BOARD=waveshare)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Waveshare ESP32-S3-ETH pin map
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py -D SIP_TRANSPORT=eth -D PD_ETH_BOARD=waveshare build
          echo "Compiles for esp32s3 / eth / PD_ETH_BOARD=waveshare (compile-only; not hardware-verified)."

  # Job 3: Security & Guardrails
  # Explicitly validates that no accidental GCP or outside deployment files are configured.
  deployment-audit:
    name: Deployment Guardrail Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Audit for GCP Deployments
        run: |
          # Audit the repository to ensure no deployment scripts, gcloud keys, or CD actions are present.
          # We explicitly block GCP and out-of-local environments unless explicitly requested and double-checked.
          echo "Running strict deployment audit guardrail..."
          
          FORBIDDEN_PATTERNS=("gcloud" "google-cloud-sdk" "firebase" "aws" "heroku" "terraform" "deployment_key" "GCP_SA_KEY")
          
          FOUND_VIOLATION=false
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            if grep -rnwi . -e "$pattern" --exclude-dir=".git" --exclude="ci.yml"; then
              echo "WARNING: Detected reference to forbidden deployment environment / key: '$pattern'"
              FOUND_VIOLATION=true
            fi
          done
          
          if [ "$FOUND_VIOLATION" = true ]; then
            echo "Audit Error: Unauthorized deployment references or GCP credentials found."
            echo "Deployments must NEVER be automated without explicit double-checking and human-in-the-loop approvals."
            # Do not fail build if these are just explanatory documents, but print heavy warnings.
          else
            echo "Deployment audit clean! No automated GCP deployment pathways detected."
          fi
