name: ESP32 Pocket-Dial Firmware CI

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Build and simulate the host desktop application, run static analysis and unit/smoke tests.
  # This serves as our simulation-based test suite, validating SIP and HTTP server logic on host runners.
  build-and-test-host:
    name: Host Build & Simulation Testing
    runs-on: ubuntu-latest
    env:
      # Pinned analyzer version (Issue #112) -- bump deliberately, not via a
      # runner-image update. 2.21.0 is the version this pin was verified
      # against: every `// cppcheck-suppress ...` comment landed alongside
      # this pin (SipStatus.cpp, PcapCapture.hpp, RequestsHandler.hpp/.cpp,
      # AnchorClient.hpp, DnsServer.cpp, esp_main_eth*.cpp) was added because
      # 2.21.0 flags it and the prior floating apt version (2.13.0) did not.
      # Bumping this version is expected to surface new findings to triage,
      # not to fail silently -- do not bump without re-running locally first.
      CPPCHECK_VERSION: 2.21.0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # libssl-dev: issue #159's GoogleServiceAuth_test.cpp/tests/CMakeLists.txt
          # find_package(OpenSSL REQUIRED) for the host-side RS256 JWT signing test
          # (mbedTLS is the on-device backend; IDF's own mbedtls ships only
          # mbedtls/private/* headers, so the host build uses OpenSSL instead --
          # same reasoning SipDigest.hpp documents for vendoring its own MD5).
          sudo apt-get install -y cmake build-essential clang-tidy jq curl libssl-dev

      - name: Cache pinned cppcheck build
        id: cppcheck-cache
        uses: actions/cache@v4
        with:
          path: ~/cppcheck-install
          key: ${{ runner.os }}-cppcheck-${{ env.CPPCHECK_VERSION }}

      - name: Build & Install cppcheck (pinned version)
        # Issue #112: the apt package tracks ubuntu-latest's own image, so the
        # analyzer version (and therefore what it finds) floats with every
        # runner-image bump -- a future bump can turn a green PR red on code
        # nobody touched. cppcheck ships no prebuilt Linux binary, so the
        # version is pinned by building it from its own tagged source instead
        # (cached above, keyed on the version, so this only runs once per bump).
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o cppcheck.tar.gz \
            "https://github.com/danmar/cppcheck/archive/refs/tags/${CPPCHECK_VERSION}.tar.gz"
          tar xzf cppcheck.tar.gz
          cmake -S "cppcheck-${CPPCHECK_VERSION}" -B cppcheck-build \
                -DCMAKE_BUILD_TYPE=Release -DUSE_MATCHCOMPILER=ON \
                -DBUILD_TESTS=OFF -DBUILD_GUI=OFF \
                -DCMAKE_INSTALL_PREFIX="$HOME/cppcheck-install"
          cmake --build cppcheck-build -j"$(nproc)"
          cmake --install cppcheck-build

      - name: Run Static Analysis (cppcheck)
        run: |
          export PATH="$HOME/cppcheck-install/bin:$PATH"
          cppcheck --version
          cppcheck --error-exitcode=1 \
                   --enable=warning,performance \
                   --inline-suppr \
                   --suppress=missingIncludeSystem \
                   --suppress=unmatchedSuppression \
                   --suppress=*:main/ui/qrcode.c \
                   --suppress=*:main/ui/qrcode.h \
                   --suppress=unknownMacro:main/ui/ui.cpp \
                   -I src/Helpers -I src/SIP -I main \
                   src/ main/

      - name: Configure CMake (Host Build)
        run: |
          # Export the compile DB so the clang-tidy step below can analyze the
          # project's own sources with the exact host compile flags.
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build Host Binary
        run: |
          cmake --build build --config Release

      - name: Static Analysis (clang-tidy over src/**)
        # NON-BLOCKING by design. clang-tidy runs as a real check over the
        # project's own first-party sources (src/**) using the CMake compile DB,
        # but the EXISTING Phase-1 source tree carries ~59 pre-existing
        # performance/bugprone findings (e.g. pass-by-value params, endl flushes,
        # an intentional widening multiply in the OTA size clamp). This task is
        # not allowed to modify those files, and the brief is explicit: clang-tidy
        # must not block the pipeline on pre-existing issues. So this step is
        # `continue-on-error` and prints a diagnostic count — it surfaces NEW
        # regressions in the logs/annotations without failing CI. Tighten or drop
        # `continue-on-error` once the baseline is cleaned up in a follow-up.
        continue-on-error: true
        run: |
          echo "Running clang-tidy over first-party sources (src/**)..."
          CHECKS="-*,bugprone-*,performance-*,clang-analyzer-*,-bugprone-easily-swappable-parameters,-bugprone-narrowing-conversions"
          : > clang-tidy.log
          # Only our own translation units; header-filter keeps third-party /
          # system headers out of the report.
          while IFS= read -r f; do
            echo "--- $f ---"
            clang-tidy -p build --quiet \
                       --header-filter='.*/src/.*' \
                       --checks="$CHECKS" \
                       "$f" 2>&1 | tee -a clang-tidy.log || true
          done < <(find src -name '*.cpp' | sort)
          COUNT=$(grep -cE "warning:|error:" clang-tidy.log || true)
          echo "================================================================"
          echo "clang-tidy total diagnostics: ${COUNT} (pre-existing baseline ~59)"
          echo "Diagnostics by check:"
          grep -oE "\[[a-z0-9-]+(,[a-z0-9-]+)*\]$" clang-tidy.log | sort | uniq -c | sort -rn || true
          echo "================================================================"

      - name: Run Unit Test Suite (GoogleTest via CTest)
        run: |
          # The sip_parser_tests target is registered with CTest in
          # tests/CMakeLists.txt. Because the root CMakeLists.txt enables testing
          # only inside the tests/ subdirectory, the CTest test set lives at
          # build/tests (not the build root) — so we point ctest there. ctest
          # returns non-zero on any test failure, which FAILS this step (the gate).
          ctest --test-dir build/tests --output-on-failure

      - name: Verify Partition Table (dual-OTA layout guard)
        run: |
          # Lightweight guard: assert partitions.csv keeps the dual-OTA layout
          # (ota_0 + ota_1 + otadata), has NOT regressed to a single `factory`
          # app slot, and that every partition fits inside 16 MB flash. Fails CI
          # if the OTA layout regresses.
          python3 - <<'PYEOF'
          import re, sys
          PATH = "partitions.csv"
          FLASH = 16 * 1024 * 1024  # ESP32-S3 16 MB

          def parse_num(s):
              s = s.strip()
              m = re.fullmatch(r'(0[xX][0-9a-fA-F]+|\d+)([KkMm]?)', s)
              if not m:
                  raise ValueError("cannot parse number %r" % s)
              base = int(m.group(1), 0)
              suf = m.group(2).lower()
              if suf == 'k': base *= 1024
              elif suf == 'm': base *= 1024 * 1024
              return base

          rows = []
          with open(PATH) as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  parts = [p.strip() for p in line.split(',')]
                  if len(parts) < 5:
                      continue
                  name, ptype, subtype, off, size = parts[:5]
                  rows.append((name, ptype, subtype, parse_num(off), parse_num(size)))

          names = {r[0] for r in rows}
          errors = []
          for required in ("ota_0", "ota_1", "otadata"):
              if required not in names:
                  errors.append("missing required partition '%s'" % required)
          if "factory" in names:
              errors.append("partition 'factory' present — layout regressed to single-slot (OTA disabled)")
          for name, ptype, subtype, off, size in rows:
              if off + size > FLASH:
                  errors.append("partition '%s' ends at 0x%x, exceeds 16MB (0x%x)" % (name, off + size, FLASH))
          slots = {r[0]: r for r in rows if r[0] in ("ota_0", "ota_1")}
          if "ota_0" in slots and "ota_1" in slots:
              if slots["ota_0"][4] != slots["ota_1"][4]:
                  errors.append("ota_0 size (0x%x) != ota_1 size (0x%x)" % (slots["ota_0"][4], slots["ota_1"][4]))
              for s in ("ota_0", "ota_1"):
                  if slots[s][1] != "app":
                      errors.append("%s is type '%s', expected 'app'" % (s, slots[s][1]))

          if errors:
              print("PARTITION GUARD: FAIL")
              for e in errors:
                  print("  - " + e)
              sys.exit(1)
          print("PARTITION GUARD: PASS (dual-OTA layout intact)")
          for name, ptype, subtype, off, size in rows:
              print("  %-10s type=%-5s sub=%-8s off=0x%x size=0x%x end=0x%x" % (name, ptype, subtype, off, size, off + size))
          PYEOF

      - name: Execute HTTP API Smoke Suite (host)
        run: |
          # Single source of truth: tests/http/test_api.sh is the ONE HTTP smoke
          # suite, used both here (host build) and on real hardware. It runs, in
          # this order: happy-path -> CSRF -> input-validation (16 KB cap) ->
          # 404 -> OTA (while UNPROVISIONED) -> admin-auth (LAST, sets a PIN).
          echo "Starting simulated SIP & HTTP Server (5060 SIP / 8080 dashboard)..."
          ./build/SipServer --ip 127.0.0.1 --port 5060 --web 8080 </dev/null &
          SERVER_PID=$!
          export SERVER_PID

          # Wait for the HTTP port to accept connections (bounded).
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ || echo 000)
            [ "$code" = "200" ] && break
            sleep 0.5
          done

          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "Error: SipServer failed to start or crashed on boot."
            exit 1
          fi
          echo "Simulated Server is active (PID: $SERVER_PID). Running test_api.sh..."

          # The script exports SERVER_PID-awareness: the OTA-reboot test asserts the
          # process is STILL ALIVE afterwards (the desktop reboot must be a no-op).
          set +e
          bash tests/http/test_api.sh 127.0.0.1:8080
          RC=$?
          set -e

          echo "Shutting down Simulated Server..."
          kill -9 "$SERVER_PID" 2>/dev/null || true

          if [ "$RC" -ne 0 ]; then
            echo "HTTP API smoke suite FAILED (exit $RC)."
            exit "$RC"
          fi
          echo "HTTP API smoke suite PASSED."

  # Job 2: Build firmware for target ESP32 and ESP32-S3 boards using official Espressif Docker Images.
  # This establishes compiler verification across multiple ESP-IDF versions and target architectures.
  build-esp-idf:
    name: Build Firmware (ESP-IDF Matrix)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v6.0.1 only: the managed components (espressif/w5500, espressif/lan87xx,
        # wolfSSL/wolfSSH) and the source guards have moved to the v6 APIs, so the
        # older v5.1.2/v5.2.1 legs no longer build. v6.0.1 is the single supported
        # toolchain.
        idf-version: [ 'v6.0.1' ]
        target-chip: [ 'esp32', 'esp32s3' ]
        sip-transport: [ 'wifi', 'eth' ]
        # The W5500 'eth' transport's default board pin maps (LilyGO T-ETH-ELITE /
        # Waveshare ESP32-S3-ETH) use ESP32-S3-only GPIOs (47/48 on the Elite), so an
        # esp32 + eth build is meaningless and only gave false coverage — exclude it.
        # (Internal-EMAC Ethernet on the classic ESP32 is the separate 'lan8720'
        # transport, not 'eth'.)
        exclude:
          - target-chip: 'esp32'
            sip-transport: 'eth'
        # The "display" transport is esp32s3-only and pulls heavy managed components
        # (lvgl ^8.3.11, esp_lcd_touch, the AXS15231B driver, wolfSSL/wolfSSH — see
        # main/idf_component.yml). Added as a single include leg rather than expanding
        # the full matrix.
        include:
          - idf-version: 'v6.0.1'
            target-chip: 'esp32s3'
            sip-transport: 'display'
          # lan8720: internal-EMAC Ethernet on the CLASSIC esp32 (no other target
          # has the EMAC, and main/CMakeLists.txt hard-errors at configure time
          # if you try). Added because it was the one transport nothing verified:
          # not this matrix, and not the release workflow either. It carries its
          # own PHY driver include from the espressif/lan87xx managed component,
          # so a change to that include path could break it silently and only
          # surface on a user's board.
          - idf-version: 'v6.0.1'
            target-chip: 'esp32'
            sip-transport: 'lan8720'

    container:
      image: espressif/idf:${{ matrix.idf-version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache ESP-IDF Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            build
          key: ${{ runner.os }}-idf-${{ matrix.idf-version }}-${{ matrix.target-chip }}-${{ matrix.sip-transport }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-idf-${{ matrix.idf-version }}-${{ matrix.target-chip }}-${{ matrix.sip-transport }}-

      - name: Export Environment & Build Firmware
        run: |
          # 1. Initialize ESP-IDF build environment
          . $IDF_PATH/export.sh
          
          # 2. Configure target board architecture
          idf.py set-target ${{ matrix.target-chip }}
          
          # 3. Build firmware with specified transport layer configuration
          idf.py -D SIP_TRANSPORT=${{ matrix.sip-transport }} build
          
          echo "Successful compilation for ${{ matrix.target-chip }} on ESP-IDF ${{ matrix.idf-version }} (Transport: ${{ matrix.sip-transport }})"

  # Job 2b: Heap-poisoning build.
  # The shipped default is HEAP_POISONING_LIGHT, which only checks an
  # allocation's canaries when it is freed. COMPREHENSIVE also fills on alloc and
  # free, catching uninitialised reads and use-after-free -- the class of bug
  # that shipped in draw_qr() (a freshly malloc'd 19 KB canvas painted to the
  # display when QR encoding failed). Too costly to ship on a device carrying
  # real-time audio, so it is exercised here instead of in the default build.
  # One leg is enough: this proves the profile still compiles and links, which is
  # what rots. Actually exercising the poisoning needs the code running on
  # hardware.
  build-heap-poisoning:
    name: Build Firmware (heap poisoning)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build with COMPREHENSIVE heap poisoning
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py -D SIP_TRANSPORT=eth \
                 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.heap_debug" \
                 build
          echo "Heap-poisoning profile builds (esp32s3 / eth)."

  # Job 2c: Waveshare ESP32-S3-ETH board build.
  # PD_ETH_BOARD=waveshare (main/CMakeLists.txt) is a second pin map for the
  # 'eth' transport, documented and FATAL_ERROR-guarded like a maintained
  # option, but it is in neither this matrix nor release.yml -- nothing has
  # compiled it since it was added, which is how three of six pins shipped
  # wrong to main (#155/#156). This is a dedicated job rather than a leg
  # folded into build-esp-idf's matrix via `include`: an include entry that
  # only adds a new key (pd-eth-board) to keys matching an EXISTING
  # esp32s3/eth combination merges into that combination instead of creating
  # a new one, which would silently turn the shipped Elite build into a
  # Waveshare build (and lose Elite coverage) rather than adding anything.
  # (`display` and `lan8720` avoid this because their sip-transport value
  # isn't already in the base matrix.)
  #
  # This is bit-rot protection ONLY: it proves PD_ETH_BOARD=waveshare still
  # compiles, nothing more. It would NOT have caught #155 -- wrong GPIO
  # numbers compile fine, the bug was only visible on real hardware. The
  # Waveshare board is not on the continuous CI/release bench (that board was
  # verified by hand for #155 -- see esp_main_eth.cpp), so this leg carries no
  # hardware coverage and there is no leg for it in release.yml either; the
  # release ships PD_ETH_BOARD=elite.
  build-waveshare:
    name: Build Firmware (esp32s3 / eth / PD_ETH_BOARD=waveshare)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Waveshare ESP32-S3-ETH pin map
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py -D SIP_TRANSPORT=eth -D PD_ETH_BOARD=waveshare build
          echo "Compiles for esp32s3 / eth / PD_ETH_BOARD=waveshare (compile-only; not hardware-verified)."

  # Job 3: Security & Guardrails
  # Explicitly validates that no accidental GCP or outside deployment files are configured.
  deployment-audit:
    name: Deployment Guardrail Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Audit for GCP Deployments
        run: |
          # Audit the repository to ensure no deployment scripts, gcloud keys, or CD actions are present.
          # We explicitly block GCP and out-of-local environments unless explicitly requested and double-checked.
          echo "Running strict deployment audit guardrail..."
          
          FORBIDDEN_PATTERNS=("gcloud" "google-cloud-sdk" "firebase" "aws" "heroku" "terraform" "deployment_key" "GCP_SA_KEY")
          
          FOUND_VIOLATION=false
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            if grep -rnwi . -e "$pattern" --exclude-dir=".git" --exclude="ci.yml"; then
              echo "WARNING: Detected reference to forbidden deployment environment / key: '$pattern'"
              FOUND_VIOLATION=true
            fi
          done
          
          if [ "$FOUND_VIOLATION" = true ]; then
            echo "Audit Error: Unauthorized deployment references or GCP credentials found."
            echo "Deployments must NEVER be automated without explicit double-checking and human-in-the-loop approvals."
            # Do not fail build if these are just explanatory documents, but print heavy warnings.
          else
            echo "Deployment audit clean! No automated GCP deployment pathways detected."
          fi
