name: CodeQL

# Advanced setup, replacing the repository's CodeQL *default* setup, which
# cannot be told to skip a change. Same languages and build mode as the default
# setup ran (c-cpp, python and actions, no build), plus the site-only gate
# (site-gate.yml), so a change that touches only the GitHub Pages site skips the
# analysis.
#
# Default setup must be switched off (Settings > Code security > CodeQL
# analysis > Switch to advanced) for this workflow's uploads to be accepted.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  site-gate:
    uses: ./.github/workflows/site-gate.yml

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: site-gate
    if: ${{ !cancelled() && needs.site-gate.outputs.code != 'false' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ c-cpp, python, actions ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
