name: ESP32 Pocket-Dial Release Artifacts

# Publish downloadable firmware + host binary on a version tag.
#
# TAGS ONLY: this workflow runs exclusively on pushes of a tag matching "v*"
# (e.g. v1.0.0). It does NOT run on normal branch pushes or pull requests, so a
# Release is only ever cut from an explicit, intentional tag.
#
# It builds the host desktop binary AND the ESP-IDF firmware for the primary
# targets, collects every flashable .bin plus partitions.csv, computes a
# SHA256SUMS manifest, and attaches everything to a GitHub Release using the
# built-in GITHUB_TOKEN (no third-party deploy/cloud credentials — see the
# deployment-audit guardrail in ci.yml).
on:
  push:
    tags:
      - 'v*'

# Required so the release job can create a GitHub Release and upload assets via
# the built-in GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Build the host desktop binary and stage it as a release artifact.
  # ---------------------------------------------------------------------------
  build-host:
    name: Build Host Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure & Build (Release)
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Stage Host Binary
        run: |
          mkdir -p artifacts
          cp build/SipServer "artifacts/SipServer-host-linux-x86_64"

      - name: Upload Host Artifact
        uses: actions/upload-artifact@v4
        with:
          name: host-binary
          path: artifacts/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build ESP-IDF firmware for the primary targets: esp32s3 x {wifi, eth} plus
  # the esp32s3 display build (added via the include leg below).
  #
  # Toolchain: v6.0.1, matching the ci.yml matrix. This was pinned to v5.2.1 long
  # after that stopped working — the v1.3.0-pre-alpha release run (2026-06-24)
  # failed on every leg with "component esp_driver_ledc could not be found",
  # because LEDC was split out of the monolithic `driver` component in a later
  # IDF and main/CMakeLists.txt requires it unconditionally. dependencies.lock
  # resolves idf 6.0.2 and two managed components carry `idf_version >= 6.0.0`
  # rules, so v5.x had no way to work. Keep this in step with ci.yml: a release
  # built on a toolchain CI does not exercise is an untested artifact.
  # ---------------------------------------------------------------------------
  build-firmware:
    name: Build Firmware (${{ matrix.target-chip }} / ${{ matrix.sip-transport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target-chip: [ 'esp32s3' ]
        sip-transport: [ 'wifi', 'eth' ]
        # display: esp32s3-only; pulls lvgl, esp_lcd_touch and the AXS15231B driver.
        include:
          - target-chip: 'esp32s3'
            sip-transport: 'display'

    container:
      image: espressif/idf:v6.0.1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Firmware Image
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target ${{ matrix.target-chip }}
          idf.py -D SIP_TRANSPORT=${{ matrix.sip-transport }} build
          echo "Built ${{ matrix.target-chip }} (transport: ${{ matrix.sip-transport }})"

      # Issue #384 (H1): a release never carries the bench probe (docs/BENCH_PROBE.md).
      - name: No bench probe in the image (#384)
        run: python3 tools/ci/check_no_bench_probe.py build

      - name: Stage Firmware Artifacts
        run: |
          TAG="${{ matrix.target-chip }}-${{ matrix.sip-transport }}"
          DEST="artifacts/${TAG}"
          mkdir -p "${DEST}"
          # Application image + the two boot-critical images needed to flash a
          # blank device. Name them per target/transport to avoid collisions when
          # several variants are gathered into one release.
          cp build/SipServer.bin                          "${DEST}/SipServer-${TAG}.bin"
          cp build/bootloader/bootloader.bin              "${DEST}/bootloader-${TAG}.bin"
          cp build/partition_table/partition-table.bin    "${DEST}/partition-table-${TAG}.bin"
          # otadata initial image (8 KB of 0xFF): points the bootloader at
          # ota_0 on first boot. The browser flasher (docs/flasher/) writes it
          # at 0xf000 so a board whose previous firmware lived in ota_1 still
          # boots the freshly written slot.
          cp build/ota_data_initial.bin                   "${DEST}/ota_data_initial-${TAG}.bin"
          # The flasher args file documents the offsets for each image.
          if [ -f build/flasher_args.json ]; then
            cp build/flasher_args.json "${DEST}/flasher_args-${TAG}.json"
          fi
          ls -l "${DEST}"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target-chip }}-${{ matrix.sip-transport }}
          path: artifacts/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Gather all artifacts, add partitions.csv, compute SHA256SUMS, and publish the
  # GitHub Release. Runs only after the builds succeed.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [ build-host, build-firmware ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Assemble Release Bundle
        run: |
          mkdir -p release
          # Flatten every uploaded artifact (host binary + per-variant firmware)
          # into a single release directory.
          find downloaded -type f \( -name '*.bin' -o -name '*.json' -o -name 'SipServer-host-*' \) \
            -exec cp {} release/ \;
          # Include the partition table as part of the published distribution so
          # consumers can verify / re-flash the layout.
          cp partitions.csv release/partitions.csv
          echo "Release bundle contents:"
          ls -l release/

      # manifest.json is what docs/flasher/index.html (the browser flasher on
      # GitHub Pages) consumes: one entry per variant with each image's offset,
      # role, and size, plus the flash mode/size/freq — all taken from the
      # build's own flasher_args-<variant>.json rather than hardcoded here, so
      # a partition-table or flash-settings change follows automatically.
      # Variant ids are the "<chip>-<transport>" tags used in the asset names
      # and must match the VARIANTS table in docs/flasher/index.html.
      #
      # It also emits "cfgseed_offset" per variant. That partition holds the
      # flash-time settings blob the browser flasher generates client-side, so
      # it is NOT a release asset and has no entry in "parts" — but its address
      # is a property of this build's partition table exactly like the app and
      # otadata offsets, and hardcoding it in the page as well as in
      # partitions.csv would be the one offset in this file not derived from the
      # build. It is read out of the published partition-table-<vid>.bin (the
      # binary, not partitions.csv: it is already per-variant like
      # flasher_args-<vid>.json, and it is authoritative even when the CSV
      # leaves an offset blank for gen_esp32part.py to fill in). Omitted when
      # the table has no cfgseed partition, which the flasher treats as "this
      # release predates flash-time configuration" and warns about.
      - name: Generate flasher manifest.json
        run: |
          python3 - "${{ github.ref_name }}" <<'EOF'
          import glob, json, os, re, struct, sys
          version = sys.argv[1]

          # esp_partition_info_t: 32 bytes each, NUL-padded name. The magic is
          # ESP_PARTITION_MAGIC, whose on-disk bytes AA 50 read back as 0x50AA
          # through a little-endian uint16 - this compared against 0xAA50 and so
          # bailed on entry 0 every time, meaning cfgseed_offset was silently
          # absent from every manifest ever generated and the flasher always
          # concluded the release predated flash-time configuration.
          def cfgseed_offset(path):
              try:
                  blob = open(path, "rb").read()
              except OSError:
                  return None
              for i in range(0, len(blob) - 31, 32):
                  magic, ptype, subtype, offset, size, name, flags = \
                      struct.unpack("<HBBII16sI", blob[i:i + 32])
                  if magic != 0x50AA:
                      break  # end of table (the MD5 entry / 0xFF padding)
                  if name.rstrip(b"\x00") == b"cfgseed":
                      return offset
              return None

          roles = {"bootloader": "bootloader", "partition-table": "partition-table",
                   "otadata": "ota-data", "app": "app"}
          stems = {"bootloader": "bootloader", "partition-table": "partition-table",
                   "otadata": "ota_data_initial", "app": "SipServer"}
          variants = {}
          for args_path in sorted(glob.glob("release/flasher_args-*.json")):
              vid = re.fullmatch(r"flasher_args-(.+)\.json", os.path.basename(args_path)).group(1)
              with open(args_path) as f:
                  args = json.load(f)
              fs = args.get("flash_settings", {})
              parts = []
              for key, role in roles.items():
                  entry = args.get(key)
                  if not entry:
                      continue
                  fname = f"{stems[key]}-{vid}.bin"
                  path = os.path.join("release", fname)
                  if not os.path.exists(path):
                      sys.exit(f"{args_path} lists {key} but {path} is missing")
                  parts.append({"offset": int(entry["offset"], 0), "file": fname,
                                "role": role, "size": os.path.getsize(path)})
              variants[vid] = {"name": vid,
                               "flash": {"size": fs.get("flash_size", "16MB"),
                                         "mode": fs.get("flash_mode", "dio"),
                                         "freq": fs.get("flash_freq", "80m")},
                               "parts": parts}
              seed_off = cfgseed_offset(os.path.join("release", f"partition-table-{vid}.bin"))
              if seed_off is not None:
                  variants[vid]["cfgseed_offset"] = seed_off
          if not variants:
              sys.exit("no flasher_args-*.json found in release/")
          with open("release/manifest.json", "w") as f:
              json.dump({"version": version, "variants": variants}, f, indent=2)
          print(open("release/manifest.json").read())
          EOF

      - name: Generate SHA256SUMS
        run: |
          cd release
          # Deterministic, sorted checksum manifest over every published file.
          sha256sum $(ls | sort) > SHA256SUMS
          echo "===== SHA256SUMS ====="
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag-triggered: github.ref_name is the pushed tag (e.g. v1.0.0).
          name: "Pocket-Dial ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*
        env:
          # Built-in token; no external/cloud deploy credentials are used.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Same-origin copy for the browser flasher ────────────────────────────
      # A browser cannot fetch a GitHub Release asset: browser_download_url 302s
      # to release-assets.githubusercontent.com, and neither the redirect nor the
      # final response sets Access-Control-Allow-Origin, so every download fails
      # CORS. api.github.com *is* CORS-enabled, so listing releases worked and
      # only the downloads failed — which is why this went unnoticed until
      # someone actually tried to flash (pocket-dial#138).
      #
      # Publishing the same images under docs/ puts them on the origin that
      # already serves the flasher, so CORS never applies. The Release stays the
      # source of truth and keeps every asset (host binary, partitions.csv,
      # SHA256SUMS); Pages carries only what the page actually fetches.
      #
      # This pushes to main, which does NOT re-trigger the workflow: the `on:`
      # block above is tags-only. Runs after the Release is published so a Pages
      # failure can never cost us the Release itself.
      - name: Publish firmware to Pages (docs/firmware/<tag>/)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages-main
          python3 tools/publish_pages_firmware.py "${GITHUB_REF_NAME}" release pages-main
          cd pages-main
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/firmware
          if git diff --cached --quiet; then
            echo "docs/firmware already up to date — nothing to push."
            exit 0
          fi
          git commit -m "chore(pages): publish ${GITHUB_REF_NAME} firmware for the browser flasher"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
