name: Commit Hygiene

on:
  # Own workflow file, own trigger -- split out of ci.yml specifically so
  # this job can listen for `edited` (needed to catch a PR base-branch
  # retarget, #242's stacked-PR shape) without also re-running the entire
  # firmware build matrix + host tests on every PR title/body edit, which
  # happens far more often than a base retarget does and costs real
  # runner minutes for zero signal on those jobs. ci.yml's own
  # pull_request trigger stays at the GitHub default types.
  pull_request:
    branches: [ '**' ]
    types: [ opened, synchronize, reopened, edited ]
  # Issue #341 gap 6: the commit that actually lands -- a squash/merge commit
  # whose message is composed (and editable) in the merge dialog AFTER the PR's
  # last run, or a direct push -- is invisible to the pull_request trigger. A
  # push run can't block what already landed, but it turns main red so the
  # trailer is seen instead of silently entering history.
  push:
    branches: [ main ]

# Least privilege (CodeQL actions/missing-workflow-permissions): the guard only
# checks out and reads git history.
permissions:
  contents: read

jobs:
  commit-hygiene-guard:
    name: Commit Hygiene Guardrail
    runs-on: ubuntu-latest
    # On a pull_request it walks the PR's own range (merge-base..head). On a
    # push to main (#341 gap 6) it walks exactly the pushed commits
    # (before..after): the squash/merge commit a PR run never saw, or a direct
    # push. It can't un-land them, but main goes red.
    #
    # Scoped to the PR's own range on purpose (issue #326): 114 commits
    # already on main carry a Claude-Session: URL trailer the project's
    # convention forbids. Retroactively enforcing this against all of
    # history would fail every future PR forever over commits nobody
    # touching that PR can fix. This catches NEW occurrences without
    # blocking on old ones -- the 114 stay as recorded technical debt, not
    # a wall everyone has to climb.
    #
    # main IS protected now (required: Host Build, Call-Graph Guard, Interop
    # Suite), but "Commit Hygiene Guardrail" is not among the required checks
    # (#341 gap 7, a settings call for the maintainer), so a red run here is
    # still a strong signal rather than an enforced gate.
    steps:
      - name: Checkout PR head (the real commit, not the synthetic merge ref)
        uses: actions/checkout@v4
        with:
          # actions/checkout's DEFAULT ref for pull_request events is
          # refs/pull/<N>/merge -- a synthetic commit GitHub generates on
          # the fly by merging the PR into its current base. Computing
          # merge-base FROM that synthetic commit answers a different
          # question than "where does this PR's real history diverge from
          # its base." Check out the PR's actual HEAD commit instead.
          # (On a push to main there is no PR: check out the pushed commit.)
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history, not the default single-commit shallow clone.
          # merge-base needs real ancestry to walk, and this repo's history
          # is small enough (a few hundred commits) that the cost is
          # negligible -- verified locally before this ever ran in CI.
          fetch-depth: 0

      - name: Self-test the shared trailer pattern (.githooks/commit-msg)
        # #341: the hook and the check below share one pattern; run the hook's
        # own self-test so a regex edit that stops catching a known-bad message,
        # or starts flagging prose, fails here instead of silently passing.
        run: sh .githooks/commit-msg --selftest

      - name: No Claude-Session trailers in this PR's commits or description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          # Passed via env, not interpolated directly into the shell script,
          # so a hostile PR title/branch name/body can't inject shell -- the
          # same reason BASE_REF and HEAD_SHA below are also read from env
          # rather than spliced into the run: block as ${{ }} literals.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Issue #341 gaps 3 + 4. One pattern, shared with .githooks/commit-msg:
          #   ^claude-session:                   the trailer, ANY case (gap 3: a
          #                                      hand-typed "claude-session:" passed)
          #   claude-session:[[:space:]]*https?://  the trailer anywhere in a line,
          #                                      followed by its URL (gap 4: a
          #                                      72-column reflow joins it onto
          #                                      the Co-authored-by line)
          # Prose that merely names the trailer ("the Claude-Session trailer")
          # and a bare session URL on its own line do not match.
          TRAILER_RE='(^claude-session:)|(claude-session:[[:space:]]*https?://)'

          if [ "$EVENT_NAME" = "push" ]; then
            # Gap 6: check exactly what landed. A new-branch push has an all-zero
            # "before"; main always exists, so fall back to the pushed commit alone.
            if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE_ARGS="-1 ${HEAD_SHA}"
            else
              RANGE_ARGS="${PUSH_BEFORE}..${HEAD_SHA}"
            fi
            echo "Checking pushed commits ${RANGE_ARGS}"
            FOUND=0
            for sha in $(git rev-list ${RANGE_ARGS}); do
              if git log -1 --format=%B "$sha" | grep -Eic "$TRAILER_RE" >/dev/null; then
                echo "::error::Commit ${sha} (\"$(git log -1 --format=%s "$sha")\") landed on main with a Claude-Session: trailer."
                FOUND=1
              fi
            done
            if [ "$FOUND" -ne 0 ]; then
              echo "A merge-time message edit or a direct push slipped a trailer past the PR check (#326, #341)."
              exit 1
            fi
            echo "Clean: no Claude-Session trailer in the pushed commits."
            exit 0
          fi

          # BASE_REF, not a hardcoded "main". This repo has stacked PRs --
          # a feat/** branch based on another unmerged feat/** branch -- and
          # this workflow's own header comment cites #242, where CI on a
          # stacked PR silently ran against the wrong base once already.
          # Hardcoding origin/main here would walk a stacked child PR's
          # merge-base all the way back to main, pulling the PARENT
          # branch's own unmerged commits into the range being checked --
          # and failing the CHILD PR for a trailer its author can't touch.
          #
          # Computed from the checked-out repo, not trusted from the event
          # payload's base.sha field -- that field reflects the base
          # branch's tip AT THE TIME OF THE LAST SYNCHRONIZE EVENT, which
          # can be stale if the base has moved since. merge-base against
          # the freshly fetched origin/$BASE_REF is the actual answer,
          # verified against the artifact rather than the metadata
          # describing it.
          BASE="$(git merge-base "origin/${BASE_REF}" HEAD)"

          echo "Checking commit range ${BASE}..${HEAD_SHA}"

          FOUND=0

          # One commit at a time (not one grep over the whole range) so a
          # hit can be reported against the specific commit that carries
          # it -- including a squash-merge commit whose OWN first line
          # looks clean but whose full body (every squashed sub-commit's
          # message, which GitHub concatenates into the squash body) still
          # carries a trailer from history further back. A check that only
          # looked at the first line or the last few lines of a message
          # would miss exactly that shape; this repo has already shipped a
          # squash commit where the trailer was buried past line 50 of a
          # 71-line body, and a manual review that used `tail -15` on that
          # same commit missed it for exactly that reason.
          # `grep -q` exits the instant it finds a match and closes its end
          # of the pipe -- fine for a short producer, but `git log`'s output
          # here can be arbitrarily large (a squash-merge body, exactly the
          # shape #326 exists to catch). If `git log` is still writing when
          # `-q` closes the pipe early, its next write() gets SIGPIPE and it
          # dies; under `pipefail` the PIPELINE's reported status becomes
          # git log's (128+SIGPIPE=141), not grep's real match result -- so
          # a commit that DOES carry the trailer silently reports "clean"
          # once its message is big enough. Reproduced deterministically
          # (5/5) with a ~550 KB message, trailer near the top -- twice,
          # independently, by two different sessions -- before this fix.
          #
          # Fix: never use `-q` against a producer that might still be
          # writing. `grep -c` (no `-q`) always reads to EOF regardless of
          # where the match is, so it never closes the pipe early and the
          # producer never gets SIGPIPE'd -- same exit-code semantics
          # (0 = found, 1 = not found), just without the early-exit race.
          for sha in $(git rev-list "${BASE}..${HEAD_SHA}"); do
            if git log -1 --format=%B "$sha" | grep -Eic "$TRAILER_RE" >/dev/null; then
              subject="$(git log -1 --format=%s "$sha")"
              echo "::error::Commit ${sha} (\"${subject}\") carries a Claude-Session: trailer."
              FOUND=1
            fi
          done

          if printf '%s\n' "$PR_BODY" | grep -Eic "$TRAILER_RE" >/dev/null; then
            echo "::error::The PR description carries a Claude-Session: trailer."
            FOUND=1
          fi

          if [ "$FOUND" -ne 0 ]; then
            echo ""
            echo "pocket-dial's convention: no Claude-Session URL in commit"
            echo "messages or PR bodies (Co-Authored-By is fine and should"
            echo "stay -- only the session-URL trailer is the problem)."
            echo ""
            echo "Fix a commit: amend it and force-push the branch."
            echo "Fix the PR body: edit the description directly."
            echo ""
            echo "If you have .githooks/commit-msg installed"
            echo "(git config core.hooksPath .githooks), this cannot happen"
            echo "at the commit stage going forward."
            exit 1
          fi

          echo "Clean: no Claude-Session trailer in this PR's commits or description."
