name: Commit Hygiene

on:
  # Own workflow file, own trigger -- split out of ci.yml specifically so
  # this job can listen for `edited` (needed to catch a PR base-branch
  # retarget, #242's stacked-PR shape) without also re-running the entire
  # firmware build matrix + host tests on every PR title/body edit, which
  # happens far more often than a base retarget does and costs real
  # runner minutes for zero signal on those jobs. ci.yml's own
  # pull_request trigger stays at the GitHub default types.
  pull_request:
    branches: [ '**' ]
    types: [ opened, synchronize, reopened, edited ]
  # Issue #341 gap 6: the commit that actually lands -- a squash/merge commit
  # whose message is composed (and editable) in the merge dialog AFTER the PR's
  # last run, or a direct push -- is invisible to the pull_request trigger. A
  # push run can't block what already landed, but it turns main red so the
  # trailer is seen instead of silently entering history.
  push:
    branches: [ main ]

# Least privilege (CodeQL actions/missing-workflow-permissions): the guard only
# checks out and reads git history.
permissions:
  contents: read

jobs:
  # Skips the jobs below when a change touches only the GitHub Pages site
  # (see site-gate.yml for why this is job-level, not paths-ignore).
  site-gate:
    uses: ./.github/workflows/site-gate.yml

  commit-hygiene-guard:
    name: Commit Hygiene Guardrail
    runs-on: ubuntu-latest
    needs: site-gate
    if: ${{ !cancelled() && needs.site-gate.outputs.code != 'false' }}
    # On a pull_request it walks the PR's own range (merge-base..head). On a
    # push to main (#341 gap 6) it walks exactly the pushed commits
    # (before..after): the squash/merge commit a PR run never saw, or a direct
    # push. It can't un-land them, but main goes red.
    #
    # Scoped to the PR's own range on purpose (issue #326): 114 commits
    # already on main carry a Claude-Session: URL trailer the project's
    # convention forbids. Retroactively enforcing this against all of
    # history would fail every future PR forever over commits nobody
    # touching that PR can fix. This catches NEW occurrences without
    # blocking on old ones -- the 114 stay as recorded technical debt, not
    # a wall everyone has to climb.
    #
    # main IS protected now (required: Host Build, Call-Graph Guard, Interop
    # Suite), but "Commit Hygiene Guardrail" is not among the required checks
    # (#341 gap 7, a settings call for the maintainer), so a red run here is
    # still a strong signal rather than an enforced gate.
    steps:
      - name: Checkout PR head (the real commit, not the synthetic merge ref)
        uses: actions/checkout@v4
        with:
          # actions/checkout's DEFAULT ref for pull_request events is
          # refs/pull/<N>/merge -- a synthetic commit GitHub generates on
          # the fly by merging the PR into its current base. Computing
          # merge-base FROM that synthetic commit answers a different
          # question than "where does this PR's real history diverge from
          # its base." Check out the PR's actual HEAD commit instead.
          # (On a push to main there is no PR: check out the pushed commit.)
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history, not the default single-commit shallow clone.
          # merge-base needs real ancestry to walk, and this repo's history
          # is small enough (a few hundred commits) that the cost is
          # negligible -- verified locally before this ever ran in CI.
          fetch-depth: 0

      - name: Self-test the hygiene gate (hook + shared patterns + range scan)
        # #341, #1106: the hook and the checks below share one pattern file,
        # tools/ci/commit_hygiene.sh. These self-tests prove it rejects the
        # trailer and the address (any case), allows users.noreply.github.com,
        # and that a bad or empty range FAILS instead of passing unchecked.
        run: |
          set -euo pipefail
          sh .githooks/commit-msg --selftest
          sh tools/ci/test_commit_hygiene.sh

      - name: Compute the range to check
        id: range
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # PASSED VIA ENV, not spliced into the script, so a hostile branch
          # name or body cannot inject shell.
          if [ "$EVENT_NAME" = "push" ]; then
            # Gap 6 (#341): check exactly what landed. A new-branch push has an
            # all-zero "before"; main always exists, so check the pushed commit
            # alone. Any other "before" MUST be in the fetched history
            # (fetch-depth 0 above): a force-push whose old tip is gone makes
            # rev-list fail, and the scan step then fails loudly -- it never
            # prints "Clean".
            if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="-1 ${HEAD_SHA}"
            else
              RANGE="${PUSH_BEFORE}..${HEAD_SHA}"
            fi
          else
            # BASE_REF, not a hardcoded "main": stacked PRs (#242) must not
            # pull their parent branch's unmerged commits into the range.
            # merge-base is computed from the checked-out repo, not trusted
            # from the payload's base.sha, which can be stale. Under set -e a
            # failing merge-base fails this step.
            BASE="$(git merge-base "origin/${BASE_REF}" HEAD)"
            RANGE="${BASE}..${HEAD_SHA}"
          fi
          echo "Checking commit range ${RANGE}"
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"

      - name: No Claude-Session trailers in this PR's commits or description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          # One pattern, shared with .githooks/commit-msg, lives in
          # tools/ci/commit_hygiene.sh (issue #341 gaps 3 + 4). The script
          # scans one commit at a time (a squash body can hide the trailer past
          # line 50, #326), uses grep -c not -q (SIGPIPE under pipefail, #339),
          # and fails -- never passes -- when rev-list or git log fails or the
          # range is empty (#1106). $RANGE is intentionally unquoted: it may be
          # "-1 <sha>".
          rc=0
          # shellcheck disable=SC2086
          sh tools/ci/commit_hygiene.sh range trailer $RANGE || rc=$?
          printf '%s\n' "$PR_BODY" | sh tools/ci/commit_hygiene.sh text trailer "The PR description" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo ""
            echo "pocket-dial's convention: no Claude-Session URL in commit"
            echo "messages or PR bodies. Commits end with --superlite only."
            echo ""
            echo "A branch with older offending commits lands through a clean"
            echo "squash message: write the squash message without the trailer."
            echo "The push run on main checks that squash commit."
            echo "Fix the PR body: edit the description directly."
            echo ""
            echo "If you have .githooks/commit-msg installed"
            echo "(git config core.hooksPath .githooks), this cannot happen"
            echo "at the commit stage going forward."
            exit 1
          fi
          echo "Clean: no Claude-Session trailer in the checked commits or description."

      - name: No noreply attribution address in this PR's commits or description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          # Project convention. The pattern is built from pieces inside
          # tools/ci/commit_hygiene.sh so no file here holds the address.
          rc=0
          # shellcheck disable=SC2086
          sh tools/ci/commit_hygiene.sh range address $RANGE || rc=$?
          printf '%s\n' "$PR_BODY" | sh tools/ci/commit_hygiene.sh text address "The PR description" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo ""
            echo "pocket-dial's convention: no noreply attribution address in"
            echo "commit messages or PR bodies."
            echo ""
            echo "A branch with older offending commits lands through a clean"
            echo "squash message: write the squash message without the address."
            echo "The push run on main checks that squash commit."
            echo "Fix the PR body: edit the description directly."
            exit 1
          fi
          echo "Clean: no noreply attribution address in the checked commits or description."
